<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hollow Pines">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Hollow Pines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=VT323&display=swap">
<style>
/* Layout: full-bleed low-res canvas. Left half = walk stick, right half = aim stick, light + focus switches on the right edge, cards for title / pause / endings. One committed night look, so no light theme. */
:root{
  --night:#040508; --ink:#d9d2c0; --dim:#7a766c; --beam:#f2e2b0; --ember:#e0743a; --red:#c23a2e; --line:#2b2c33;
  --title:'Jacquard 12','VT323',Georgia,serif; --mono:'VT323',ui-monospace,Menlo,monospace;
  --sl:max(16px, env(safe-area-inset-left, 0px)); --sr:max(16px, env(safe-area-inset-right, 0px));
  --st:max(10px, env(safe-area-inset-top, 0px)); --sb:max(10px, env(safe-area-inset-bottom, 0px));
  color-scheme:dark;
}
html.rot{--sl:max(16px, env(safe-area-inset-top, 0px));--sr:max(16px, env(safe-area-inset-bottom, 0px));--st:max(10px, env(safe-area-inset-right, 0px));--sb:max(10px, env(safe-area-inset-left, 0px))}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--mono)}
body{position:fixed;inset:0}
/* the game is always landscape: turned 90 degrees when the phone is upright */
html.rot body{right:auto;bottom:auto;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#app{position:absolute;inset:0;overflow:hidden;background:var(--night)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#touch{position:absolute;inset:0}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(90,0,0,.55) 100%)}
.stick{position:absolute;width:168px;height:168px;margin:-84px 0 0 -84px;border-radius:50%;border:2px solid rgba(217,210,192,.16);pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(217,210,192,.14)}
.hint{position:absolute;bottom:calc(var(--sb) + 8px);font-size:18px;letter-spacing:.2em;color:var(--dim);pointer-events:none;transition:opacity 1.5s}
#hintL{left:calc(var(--sl) + 40px)}#hintR{right:calc(var(--sr) + 110px)}
button{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
#pauseBtn{position:absolute;left:var(--sl);top:var(--st);width:40px;height:40px;font-size:20px;color:var(--dim);border-color:transparent}
#rbtns{position:absolute;right:var(--sr);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
#focusBtn{width:58px;height:34px;font-size:17px;letter-spacing:.08em;color:var(--dim);background:rgba(4,5,8,.5)}
#focusBtn.narrow{color:var(--beam);border-color:#5b5440}
#lightBtn{width:72px;height:72px;border-radius:50%;font-size:17px;letter-spacing:.1em;color:var(--dim);background:rgba(4,5,8,.5);border-color:#33343c}
#lightBtn.on{color:#1a1608;background:var(--beam);border-color:var(--beam);box-shadow:0 0 18px rgba(242,226,176,.25)}
#lightBtn.dead{color:var(--ember);background:rgba(4,5,8,.5);border-color:#5a3020;box-shadow:none}
#card{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,2,4,.55);padding:var(--st) var(--sr) var(--sb) var(--sl);z-index:20;overflow:auto}
#card.solid{background:rgba(2,2,4,.92)}
.box{max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.box h1{font-family:var(--title);font-weight:400;font-size:clamp(56px,13vh,96px);line-height:.9;margin:0;color:var(--beam);text-shadow:0 0 24px rgba(242,226,176,.18);text-wrap:balance}
.box h2{font-family:var(--title);font-weight:400;font-size:clamp(40px,10vh,64px);line-height:1;margin:0;text-wrap:balance}
.box h2.bad{color:var(--red)}.box h2.good{color:var(--beam)}
.box p{margin:0;font-size:21px;line-height:1.15;color:var(--ink);text-wrap:balance}
.box p.dim{color:var(--dim);font-size:18px}
.box ul{margin:0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:19px;line-height:1.1}
.box ul b{color:var(--beam);font-weight:400}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.box button{padding:8px 18px;font-size:22px;letter-spacing:.06em;min-width:150px}
.box button.primary{background:var(--beam);color:#1a1608;border-color:var(--beam)}
.stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:19px;color:var(--dim);font-variant-numeric:tabular-nums}
.stats b{display:block;font-size:30px;color:var(--ink);font-weight:400}
#talk{position:absolute;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);width:min(620px,calc(100% - var(--sl) - var(--sr)));box-sizing:border-box;padding:10px 16px 12px;background:rgba(4,5,8,.86);border:2px solid var(--line);z-index:15;cursor:pointer}
#talk b{display:block;font-weight:400;font-size:17px;letter-spacing:.14em;color:var(--ember);text-transform:uppercase}
#talk.you b{color:var(--dim)}
#talk p{margin:2px 0 0;font-size:22px;line-height:1.15;color:var(--ink)}
#talk span{position:absolute;right:12px;bottom:6px;font-size:15px;color:var(--dim);letter-spacing:.1em}
@media (prefers-reduced-motion: reduce){.hint{transition:none}}
</style>
</head><body>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="touch"></div>
  <div id="vig"></div>
  <div class="stick" id="stL" hidden><i></i></div>
  <div class="stick" id="stR" hidden><i></i></div>
  <div class="hint" id="hintL" hidden>WALK</div>
  <div class="hint" id="hintR" hidden>AIM</div>
  <div id="talk" hidden><b id="talkWho"></b><p id="talkText"></p><span>TAP</span></div>
  <button id="pauseBtn" aria-label="Pause" hidden>II</button>
  <div id="rbtns" hidden>
    <button id="focusBtn" aria-label="Beam focus">WIDE</button>
    <button id="lightBtn" class="on" aria-label="Flashlight">LIGHT</button>
  </div>
  <div id="card"><div class="box"><h1>Hollow Pines</h1><p class="dim">Loading the woods</p></div></div>
</div>

<script>
'use strict';
// Hollow Pines: top-down flashlight horror. Everything is drawn into a small pixel buffer, then lit
// per pixel by the flashlight cone (with tree shadows), fires, the trailhead lamp and moonlight pools.
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const R = () => Math.random();
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const C = hex => { const n = parseInt(hex.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
const BLACK = 0xff000000 >>> 0;

// ---------------- screen ----------------
const PPM = 9;                 // pixels per meter
let W = 320, H = 180, img, out32, ob, LX, LY, LF;
let rotated = false;
const VW = () => rotated ? innerHeight : innerWidth, VH = () => rotated ? innerWidth : innerHeight;
function ptL(e) { return rotated ? { x: e.clientY, y: innerWidth - e.clientX } : { x: e.clientX, y: e.clientY }; }
function resize() {
  rotated = innerHeight > innerWidth;
  document.documentElement.classList.toggle('rot', rotated);
  const asp = VW() > 0 && VH() > 0 ? VW() / VH() : 16 / 9;
  H = 180; W = clamp(Math.round(H * asp), 240, 440) || 320;
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H); out32 = new Uint32Array(img.data.buffer); ob = new Uint32Array(W * H); LX = new Float32Array(W * H); LY = new Float32Array(W * H); LF = new Uint8Array(W * H);
}
addEventListener('resize', resize);
resize();

// ---------------- world ----------------
// Chapter 1, "The Washout": the car dies on a back road; the storm took the road at the creek; a hiking path
// crosses the creek on a footbridge and winds north through the pines to a camper's fire.
const WX0 = -76, WX1 = 76, WY0 = -462, WY1 = 30, TEX = 4;
const GW = (WX1 - WX0) * TEX, GH = (WY1 - WY0) * TEX;
const PY0 = -53, PEND = -330;          // the path runs from the trail post (PY0) to the camp (PEND)
const CREEKY = -66, ROADTOP = -86;      // creek line and where the far side of the road disappears
const ground = new Uint32Array(GW * GH);
const HC = 6, HGX = Math.ceil((WX1 - WX0) / HC), HGY = Math.ceil((WY1 - WY0) / HC);
let PX = [], solidG, decorG, trees, reflectors, decoys, moons, fires, lights, logs, rocks, ferns, bushes;
let CAR, CAMP, TENT, CAMPER, POST, BRIDGE, BARRIER, hazards;
let FORK, BR = [], DEN, DENPROPS = [], DARK = [];
// stretches under thick canopy: no moonlight gets through, so with the light off you see nothing at all
function darkAt(y) { let d = 0; for (const [a, b] of DARK) d = Math.max(d, sstep(a + 6, a - 2, y) * sstep(b - 6, b + 2, y)); return d; }
function distBranch(x, y) {
  if (!BR.length || y > FORK.y + 3 || y < DEN.y - 12) return 99;
  let best = 99;
  for (let i = 0; i < BR.length - 1; i++) { const a = BR[i], b = BR[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy, t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / L2, 0, 1); best = Math.min(best, Math.hypot(x - a[0] - dx * t, y - a[1] - dy * t)); }
  return best;
}
let rnd = mulberry32(1);

const PAL = {
  needle: ['#5e452c', '#6b4f33', '#4f3a26'].map(C), leaf: ['#7a5530', '#8a6236', '#6b3f24'].map(C),
  moss: ['#45512a', '#535f31', '#3a4524'].map(C), dirt: ['#8f7a5a', '#9c8763', '#7f6b4e'].map(C),
  gravel: ['#77726a', '#86817a', '#67625b'].map(C), asphalt: ['#3b3b3d', '#454547', '#2f2f31'].map(C), paint: C('#b9b39c'),
  mud: ['#3c3227', '#30281f'].map(C), water: ['#1d2a33', '#24343f', '#162129'].map(C), glint: C('#6f8796'),
  ash: C('#4a4540'), twig: C('#a08f70'),
  pine: ['#5b4433', '#4a372a', '#33261c'].map(C), oak: ['#544538', '#463a2f', '#2e261f'].map(C),
  birch: ['#d9d5ca', '#c4c0b4', '#8d897f'].map(C), birchMark: C('#2a2724'),
  rock: ['#86837b', '#6f6c65', '#55534d'].map(C), fern: ['#4f6b33', '#5f7c3a', '#3e5628'].map(C),
  bush: ['#3d5a2c', '#4a6833', '#2f4622', '#55703a'].map(C),
  stump: ['#a39c8e', '#8a8477', '#6a655b'].map(C),
  hide: ['#15130f', '#2b2620', '#40382d'].map(C), horn: C('#211d18'), hornHi: C('#3a342a'), tooth: ['#b3a684', '#d8ceb0'].map(C), claw: C('#35302a'), mouth: C('#040303'),
  deer: ['#7d5b3c', '#6a4b30', '#d8cdb8'].map(C), jacket: C('#3f4a5c'), hair: C('#3a2a20'), hand: C('#c9a98a'), torch: C('#d0d0cc'),
  camper: [C('#b8503a'), C('#5a2418'), C('#d9b08c'), C('#262422'), C('#e0d6c0')],
  tent: ['#4f6a52', '#3c5440', '#6b8a6c'].map(C), car: ['#6a4a3c', '#53392e', '#1d2227', '#a8b0b8'].map(C), refl: C('#cfe6f2'),
  stone: ['#7d7a72', '#5f5c56'].map(C), log: ['#5a4230', '#7c6248', '#3c2c20'].map(C), post: C('#4a3a2a'),
  plank: ['#6e5638', '#5a452c', '#7d6442'].map(C), bone: [C('#cfc6b0'), C('#a49b86')], pack: [C('#3d5a7a'), C('#2a3f57')], torn: [C('#7a6a3a'), C('#5a4c28'), C('#1a1612')],
  coon: ['#6b6862', '#3a3835', '#a9a59b', '#1c1b1a'].map(C), rabbit: ['#7a6650', '#5a4a3a', '#d8d0c0'].map(C), fox: ['#a8582a', '#7a3c1c', '#e8e0d0', '#2a1a12'].map(C), owl: C('#4a4036'), stripe: [C('#c8c0a8'), C('#a8432c')],
};

const roadX = y => 3 * Math.sin(y * 0.031) + 1.5 * Math.sin(y * 0.083 + 1);
const creekY = x => CREEKY + 2.6 * Math.sin(x * 0.06 + 0.7) + 1.1 * Math.sin(x * 0.17);
function onRoad(x, y, pad = 0) { return y > ROADTOP && y < WY1 && Math.abs(x - roadX(y)) < 3.4 + pad && !(y < CREEKY + 4 && y > CREEKY - 4.5); }
function pathX(y) {
  let k = (PY0 - y) / 2; const n = PX.length - 1;
  if (k < 0) k = 0; if (k > n) k = n;
  const i = Math.floor(k), f = k - i; return PX[i] + (PX[Math.min(n, i + 1)] - PX[i]) * f;
}
function distPath(x, y) {
  if (y > PY0) return Math.hypot(x - PX[0], y - PY0);
  if (y < PEND) return Math.hypot(x - pathX(PEND), y - PEND);
  const s = (pathX(y - 1) - pathX(y + 1)) / 2;
  return Math.abs(x - pathX(y)) / Math.sqrt(1 + s * s);
}
function gridAdd(G, o, x0, y0, x1, y1) {
  const a = clamp(Math.floor((x0 - WX0) / HC), 0, HGX - 1), b = clamp(Math.floor((x1 - WX0) / HC), 0, HGX - 1);
  const c = clamp(Math.floor((y0 - WY0) / HC), 0, HGY - 1), d = clamp(Math.floor((y1 - WY0) / HC), 0, HGY - 1);
  for (let gy = c; gy <= d; gy++) for (let gx = a; gx <= b; gx++) G[gy * HGX + gx].push(o);
}
let stamp = 1;
function near(G, x, y, r, cb) {
  stamp++;
  const a = clamp(Math.floor((x - r - WX0) / HC), 0, HGX - 1), b = clamp(Math.floor((x + r - WX0) / HC), 0, HGX - 1);
  const c = clamp(Math.floor((y - r - WY0) / HC), 0, HGY - 1), d = clamp(Math.floor((y + r - WY0) / HC), 0, HGY - 1);
  for (let gy = c; gy <= d; gy++) for (let gx = a; gx <= b; gx++) {
    const L = G[gy * HGX + gx];
    for (let i = 0; i < L.length; i++) { const o = L[i]; if (o._s === stamp) continue; o._s = stamp; cb(o); }
  }
}
function addSolid(o) {
  if (o.t === 'log') gridAdd(solidG, o, Math.min(o.x1, o.x2) - o.r, Math.min(o.y1, o.y2) - o.r, Math.max(o.x1, o.x2) + o.r, Math.max(o.y1, o.y2) + o.r);
  else gridAdd(solidG, o, o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r);
}
function addDecor(o) { gridAdd(decorG, o, o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r); }
function blocked(x, y, r) {
  let hit = false;
  if (x < WX0 + 3 || x > WX1 - 3 || y < WY0 + 3 || y > WY1 - 3) return true;
  near(solidG, x, y, r + 1.5, o => {
    if (hit) return;
    if (o.t === 'log') { if (segDist(x, y, o) < o.r + r) hit = true; }
    else if (Math.hypot(x - o.x, y - o.y) < o.r + r) hit = true;
  });
  return hit;
}
function segDist(x, y, o) {
  const dx = o.x2 - o.x1, dy = o.y2 - o.y1, L2 = dx * dx + dy * dy;
  const t = clamp(((x - o.x1) * dx + (y - o.y1) * dy) / L2, 0, 1);
  return Math.hypot(x - (o.x1 + dx * t), y - (o.y1 + dy * t));
}
// is there a clear line between two points? (tree trunks and big rocks block it)
function losClear(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 0.7);
  for (let i = 1; i < n; i++) {
    const t = i / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t; let hit = false;
    near(solidG, x, y, 1.2, o => { if (!hit && (o.t === 'tree' || (o.t === 'rock' && o.r > 0.55)) && Math.hypot(x - o.x, y - o.y) < o.r + 0.1) hit = true; });
    if (hit) return false;
  }
  return true;
}

function buildWorld(seed) {
  rnd = mulberry32(seed);
  solidG = Array.from({ length: HGX * HGY }, () => []); decorG = Array.from({ length: HGX * HGY }, () => []);
  trees = []; reflectors = []; decoys = []; moons = []; fires = []; logs = []; rocks = []; ferns = []; bushes = []; hazards = [];

  // the path: leaves the road at the trail post, angles west down to the footbridge, then wanders north
  const off = rnd() * 1000; PX = [];
  const x0 = roadX(PY0) - 4.6;
  const wig = t => Math.sin(t * 0.013 + off) * 20 + Math.sin(t * 0.031 + off * 1.7) * 8 + Math.sin(t * 0.077 + off * 2.3) * 2.5;
  for (let y = PY0; y >= PEND - 2; y -= 2) {
    const t = PY0 - y;
    const lead = -20 * sstep(0, 18, t);                       // along the bank to the bridge
    const free = (wig(t) - wig(40)) * sstep(24, 64, t);       // then the woods take over
    PX.push(clamp(x0 + lead + free, -58, 58));
  }
  // where the path meets the creek is the footbridge
  let by = CREEKY; for (let i = 0; i < 6; i++) by = creekY(pathX(by));
  BRIDGE = { x: pathX(by), y: by, a: Math.atan2(-1, (pathX(by - 1) - pathX(by + 1)) / 2) };

  // the fork: an old path, just as worn, peels off into the creature's place
  FORK = { y: PY0 - (PY0 - PEND) * 0.55 };
  {
    const y0 = FORK.y, x0 = pathX(y0), tdx = (pathX(y0 - 1) - pathX(y0 + 1)) / 2;
    const side = Math.sign(x0 + tdx * 20 - pathX(y0 - 20)) || 1; // keep going the way the path was heading, then bend away from it
    let x = x0, y = y0, th = Math.atan2(-1, tdx); BR = [];
    for (let i = 0; i <= 46; i++) { BR.push([x, y]); if (i > 10) th += side * 0.036; x = clamp(x + Math.cos(th), -60, 60); y += Math.sin(th); }
    FORK.x = x0; DEN = { x, y };
  }
  DARK = [[PY0 - 58, PY0 - 98], [FORK.y + 22, FORK.y - 30]];

  // places
  CAR = { x: roadX(14) + 0.4, y: 14, a: -Math.PI / 2 + 0.06, w: 4.4, h: 1.9 };
  POST = { x: roadX(PY0) - 3.9, y: PY0 + 0.6 };
  BARRIER = { x: roadX(CREEKY + 6), y: CREEKY + 6, w: 5.6 };
  CAMP = { x: pathX(PEND) + 1.2, y: PEND - 2 };
  TENT = { x: CAMP.x + 4.2, y: CAMP.y - 2.4, a: 0.35, w: 2.4, h: 1.8 };
  CAMPER = { x: CAMP.x - 1.9, y: CAMP.y + 1.1, a: Math.atan2(CAMP.y - (CAMP.y + 1.1), CAMP.x - (CAMP.x - 1.9)) };
  const campfire = { x: CAMP.x, y: CAMP.y, r: 7.5, safe: 5.2, i: 1.0, c: [1, 0.55, 0.22], ph: rnd() * 9 };
  fires.push(campfire);
