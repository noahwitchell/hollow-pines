const PAL = {

  dirt: '#3a2a1c', dirt2: '#2c2015', moss: '#1f2a15', moss2: '#2a3619', leaf: '#3d2b18',

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PALRGB = Object.values(PAL).map(hex);

    dot(x, y, col, r = 0.5) { ctx.fillStyle = col; ctx.fillRect(Math.round(X(x) - r), Math.round(Y(y) - r), Math.max(1, r * 2), Math.max(1, r * 2)); },

// smooth curve through control points (Catmull-Rom)

const spiral = (cx, cy, r0, r1, a0, a1, n = 30) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, r = r0 + (r1 - r0) * t, a = a0 + (a1 - a0) * t; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });

// ---------- the creature ----------

// antlers that stick out from the head. Local coords: x = outward from the skull, y = up (metres).
const ANTLERS = {
  D: { beam: [[0, 0], [0.16, 0.05], [0.34, 0.08], [0.5, 0.17]], tines: [[0.12, -25, 0.07], [0.38, 75, 0.15], [0.62, 85, 0.18], [0.86, 60, 0.12]], w: 0.06 },
  E: { beam: [[0, 0], [0.1, 0.14], [0.2, 0.32], [0.2, 0.5], [0.13, 0.62]], tines: [[0.1, -10, 0.07], [0.3, 20, 0.14], [0.55, 25, 0.15], [0.78, 35, 0.11]], w: 0.06 },
  F: { beam: [[0, 0], [0.13, 0.07], [0.22, 0.03], [0.36, 0.13], [0.42, 0.26], [0.54, 0.3]], tines: [[0.15, 100, 0.09], [0.32, -30, 0.08], [0.45, 70, 0.17], [0.58, 125, 0.1], [0.72, 40, 0.13], [0.9, 95, 0.09]], w: 0.055, broken: 0.62 },

function antlerSide(p, bx, by, sg, def, k, cut = 1) {

// antlers grow low and hug the skull, so in shadow the head just reads as too big and lumpy
function antlers(p, hx, hy, v) {
  if (ANTLERS[v]) { const k = p.s < 30 ? 1.5 : 1, def = ANTLERS[v];
    for (const sg of [-1, 1]) antlerSide(p, hx + sg * 0.075, hy - 0.13, sg, def, k, def.broken && sg < 0 ? def.broken : 1);
    return; }
  for (const sg of [-1, 1]) {
    if (v === 'A') { // ram curl wrapping back and down around the side of the skull
      // at game scale the horns are drawn 2x and pushed out so the coils clear the face
      const k = p.s < 30 ? 2 : 1, ax = hx + sg * 0.09, ay = hy - 0.12, push = sg * 0.17 * (k - 1);
      const pts = spiral(hx + sg * 0.15, hy - 0.03, 0.135, 0.035, -Math.PI / 2 - sg * 0.45, -Math.PI / 2 - sg * 0.45 + sg * 1.8 * Math.PI, 40).map(q => [ax + (q[0] - ax) * k + push, ay + (q[1] - ay) * k]);

      p.line(pts.slice(1, -8).map(q => [q[0] - 0.014 * sg * k, q[1] - 0.014 * k]), 0.03 * k, 0.012 * k, PAL.hornHi);
      for (let k = 4; k < pts.length - 6; k += 3) p.dot(pts[k][0], pts[k][1], PAL.hide1); // growth ridges
    } else if (v === 'B') { // root crown: thin tangled tines swept back, then down along the skull

const TEETH = (() => { seed = 3; return Array.from({ length: 13 }, (_, i) => ({ x: (i + 0.5) / 13 + (R() - 0.5) * 0.03, L: 0.014 + R() * 0.02 + (i === 3 || i === 9 ? 0.03 : 0), a: (R() - 0.5) * 0.35, gone: R() < 0.12, lo: 0.012 + R() * 0.018 })); })();

    const a = dir + (f - 1.5) * 0.2 * sg, l1 = 0.16 * len, kx = wx + Math.cos(a) * l1, ky = wy + Math.sin(a) * l1;

function body(p, o) { // front 3/4 view, feet at (0,0)

    p.line([[sg * 0.1, hipY], [sg * (st ? 0.24 : 0.17), kneeY], [sg * 0.13, -0.2], [sg * 0.15, -0.02]], 0.14, 0.05, PAL.hide0);
    p.line([[sg * 0.14, hipY + 0.1], [sg * (st ? 0.22 : 0.16), kneeY]], 0.03, 0.02, PAL.hide1);
    for (const t of [-1, 0, 1]) p.line([[sg * 0.15, -0.03], [sg * 0.15 + t * 0.06, 0.012]], 0.022, 0.012, PAL.hide1);

  p.poly([[-0.12, hipY + 0.04], [0.12, hipY + 0.04], [0.15, hipY - 0.13], [0.11, (hipY + shY) / 2 + 0.08], [0.2, shY + 0.32], [shW, shY + 0.12], [shW * 0.85, shY - 0.06], [0.16, shY - 0.13], [-0.16, shY - 0.13], [-shW * 0.85, shY - 0.06], [-shW, shY + 0.12], [-0.2, shY + 0.32], [-0.11, (hipY + shY) / 2 + 0.08], [-0.15, hipY - 0.13]], PAL.hide0);

  else {
  const pts = spiral(hx - 0.05, hy - 0.02, 0.135, 0.04, -Math.PI * 0.55, -Math.PI * 0.55 + 1.75 * Math.PI, 34);
  p.line(pts, 0.09, 0.028, PAL.horn); p.line(pts.slice(1, -6).map(q => [q[0] - 0.01, q[1] - 0.01]), 0.022, 0.01, PAL.hornHi);
  }
}

// ---------- backgrounds ----------
function ground(ctx, w, h, opts = {}) {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = vnoise(x / 9, y / 9) * 0.65 + vnoise(x / 3, y / 3) * 0.35 + (hash(x, y) - 0.5) * 0.18;
    const tx = w / 2 + Math.sin(y * 0.025 + 1) * 10, trail = opts.trail && Math.abs(x - tx) < 15 + vnoise(0.5, y / 5) * 5;
    ctx.fillStyle = trail ? (n > 0.5 ? PAL.dirt : PAL.dirt2) : n > 0.66 ? PAL.moss2 : n > 0.42 ? PAL.moss : n > 0.28 ? PAL.leaf : PAL.dirt2;
    ctx.fillRect(x, y, 1, 1);
  }
}
function trunk(ctx, x, y, r, lean) { // top-down trunk: base disc and a dark shaft leaning away from view centre
  ctx.lineCap = 'round';
  ctx.strokeStyle = PAL.trunk; ctx.lineWidth = r * 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + lean[0], y + lean[1]); ctx.stroke();
  ctx.strokeStyle = PAL.trunk2; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - r * 0.5, y); ctx.lineTo(x + lean[0] - r * 0.5, y + lean[1]); ctx.stroke();
}

// ---------- composite into the game's look ----------
const HORNHI = palOf(PAL.hornHi), EYE = palOf(PAL.eye), RED = palOf(PAL.red), GLOW = palOf(PAL.glow), RGLOW = palOf(PAL.redGlow);
function nearest(r, g, b) { let best = 0, bd = 1e9; for (let i = 0; i < PALRGB.length; i++) { const c = PALRGB[i], d = (c[0] - r) ** 2 + (c[1] - g) ** 2 + (c[2] - b) ** 2; if (d < bd) { bd = d; best = i; } } return PALRGB[best]; }
function panel(w, h, drawBg, drawFg, light, night = false) {
  const bg = layer(w, h), fg = layer(w, h); drawBg(bg); drawFg(fg);
  const B = bg.getImageData(0, 0, w, h).data, F = fg.getImageData(0, 0, w, h).data, out = layer(w, h), O = out.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, isF = F[i + 3] >= 110; let c;
    if (isF) c = nearest(F[i] * 255 / F[i + 3], F[i + 1] * 255 / F[i + 3], F[i + 2] * 255 / F[i + 3]); else c = nearest(B[i], B[i + 1], B[i + 2]);
    const emis = isF && (c === EYE || c === RED) ? 1.15 : isF && (c === GLOW || c === RGLOW) ? 0.7 : 0;
    const l = Math.max(emis, light(x, y, isF, c)), steps = night ? 12 : 6, lv = Math.min(1.15, Math.floor(l * steps + BAYER[(y & 3) * 4 + (x & 3)] / 16) / steps);
    if (night) { // dark-adapted eyes: colour drains away into a faint blue-grey
      const lum = (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) * lv * 1.5;
      O.data[i] = lum * 0.72; O.data[i + 1] = lum * 0.84; O.data[i + 2] = lum * 1.08;
    } else { O.data[i] = c[0] * lv; O.data[i + 1] = c[1] * lv; O.data[i + 2] = c[2] * lv; }
    O.data[i + 3] = 255;
  }
  out.putImageData(O, 0, 0); return out.canvas;
}
const beamLight = (px, py, aim = -Math.PI / 2, half = 0.5, range = 120, amb = 0.0) => (x, y) => {
  const dx = x - px, dy = y - py, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx) - aim;
  const off = Math.abs(Math.atan2(Math.sin(a), Math.cos(a)));
  const cone = Math.max(0, 1 - Math.max(0, off - half * 0.55) / (half * 0.6));
  return amb + 1.2 * cone / (1 + (d / range) ** 2) + Math.max(0, 0.5 - d / 24);
};
const spotLight = (cx, cy, r, amb = 0.12, peak = 1.1) => (x, y) => amb + peak / (1 + ((x - cx) ** 2 + (y - cy) ** 2) / (r * r));

// ---------- the sheet ----------
const PW = 160, PH = 128, SC = 3, GAP = 6, LAB = 16, COLS = 3;
const panels = [];
const DEF = new URLSearchParams(location.search).get('a') || 'D';
const plain = c => { const g = c.createLinearGradient(0, 0, 0, PH); g.addColorStop(0, PAL.bg); g.addColorStop(1, PAL.bg2); c.fillStyle = g; c.fillRect(0, 0, PW, PH); };
// row 1: three heads, close
for (const [v, name] of [['D', 'D  Low spread'], ['E', 'E  Upswept'], ['F', 'F  Gnarled, one broken']]) {
  panels.push({ name, img: panel(PW, PH, plain, c => { const p = pen(c, PW / 2, PH * 0.62 + 2.05 * 150, 150); head(p, 0, -2.05, { variant: v }); }, spotLight(PW / 2, PH * 0.38, 70, 0.12, 1.0)) });
}
// row 2: poses at design scale (variant A), lit by a beam from below
const poseBg = c => ground(c, PW, PH, { trail: true });
const poseLight = beamLight(PW / 2, PH + 30, -Math.PI / 2, 0.9, 140, 0.05);
panels.push({ name: 'Upright: watching', img: panel(PW, PH, poseBg, c => body(pen(c, PW / 2, PH - 8, 50), { pose: 'up', variant: DEF }), poseLight) });
panels.push({ name: 'Stooped: following', img: panel(PW, PH, poseBg, c => body(pen(c, PW / 2, PH - 8, 56), { pose: 'stoop', variant: DEF }), poseLight) });
panels.push({ name: 'All fours: hunting', img: panel(PW, PH, poseBg, c => bodyFours(pen(c, PW / 2 - 20, PH - 14, 74), { variant: DEF }), poseLight) });
// row 3: game scale in the beam, the same spot in night vision, and the catch
const TREES = [[20, 40, 4], [40, 96, 5], [122, 26, 4], [140, 88, 5], [58, 14, 3], [104, 112, 4], [152, 52, 3], [10, 112, 4], [96, 44, 3]];
const woods = c => { ground(c, PW, PH, { trail: true }); for (const [x, y, r] of TREES) trunk(c, x, y, r, [(x - PW / 2) * 0.4, (y - PH * 0.95) * 0.4]); };
const CX = PW / 2 - 4, CY = 74, GS = 9 * 1.5; // creature feet; game scale = 9 px per metre, creature drawn 1.5x life
panels.push({ name: 'Game scale, in the beam', img: panel(PW, PH, woods, c => body(pen(c, CX, CY, GS), { pose: 'up', variant: DEF }), beamLight(PW / 2, PH - 6, -Math.PI / 2 + 0.05, 0.62, 90, 0.02)) });
const moonL = (x, y) => 0.16 + 0.5 * Math.max(0, 1 - Math.hypot((x - CX - 2) / 34, (y - CY + 24) / 24));
const nightBg = c => { woods(c); };
panels.push({ name: 'Game scale, eyes adjusted', img: panel(PW, PH, nightBg, c => body(pen(c, CX, CY, GS), { pose: 'up', variant: DEF, eyes: 'none' }), (x, y, isF, col) => { const bone = isF && (col[0] > 100 || col === HORNHI); return bone ? 0.42 : moonL(x, y) + 0.04; }, true) });
panels.push({ name: 'Caught', img: panel(PW, PH, c => { c.fillStyle = '#000'; c.fillRect(0, 0, PW, PH); }, c => { const p = pen(c, PW / 2, PH * 0.5 + 2.05 * 230, 230); head(p, 0, -2.05, { variant: DEF, jaw: 1, eyes: 'red' }); }, spotLight(PW / 2, PH * 0.7, 55, 0.0, 1.2)) });


// ---------- full-screen mocks at the game's buffer size ----------
const FW = 320, FH = 180, FS = 4;
const PX = FW / 2 - 6, PY = FH * 0.66, MX = FW / 2 + 46, MY = FH * 0.44; // player, creature feet
const MOONS = [[MX + 4, MY - 26, 40, 26], [60, 40, 30, 18], [262, 140, 34, 20], [96, 150, 22, 14]];
const fullTrees = (() => { seed = 21; const t = []; while (t.length < 26) { const x = R() * FW, y = R() * FH, tx = FW / 2 + Math.sin(y * 0.025 + 1) * 10; if (Math.abs(x - tx) < 24 || Math.hypot(x - MX, y - MY + 14) < 26 || Math.hypot(x - PX, y - PY) < 20) continue; t.push([x, y, 3 + R() * 3]); } return t; })();
const fullWoods = c => { ground(c, FW, FH, { trail: true }); for (const [x, y, r] of fullTrees) trunk(c, x, y, r, [(x - FW / 2) * 0.32, (y - FH / 2) * 0.32]); };
const player = c => { const p = pen(c, PX, PY, 9); p.ell(0, 0, 0.34, 0.28, PAL.moon2); p.ell(0, -0.04, 0.18, 0.18, PAL.bone0); p.line([[0.12, -0.12], [0.45, -0.4]], 0.08, 0.08, PAL.hide2); };
const moonFull = (x, y) => { let m = 0; for (const [mx, my, rx, ry] of MOONS) m = Math.max(m, 1 - Math.hypot((x - mx) / rx, (y - my) / ry)); return 0.2 + 0.5 * Math.max(0, m); };
const fullNight = () => panel(FW, FH, fullWoods, c => { player(c); body(pen(c, MX, MY, GS), { pose: 'up', variant: DEF, eyes: 'none' }); }, (x, y, isF, col) => isF && (col[0] > 100 || col === HORNHI) ? 0.42 : moonFull(x, y) * (col[0] > 50 && !isF ? 1.25 : 1), true);
const fullNightOld = () => panel(FW, FH, fullWoods, c => { player(c); body(pen(c, MX, MY, GS), { pose: 'up', variant: DEF, eyes: 'none' }); }, (x, y, isF, col) => isF && col[0] > 100 ? 0.3 : moonFull(x, y));
const aimA = Math.atan2(MY - 12 - PY, MX - PX);
const fullBeam = () => panel(FW, FH, fullWoods, c => { player(c); body(pen(c, MX, MY, GS), { pose: 'up', variant: DEF }); }, beamLight(PX, PY, aimA, 0.6, 110, 0.0));
window.postFull = async (name, which) => { const img = which === 'lit' ? panel(FW, FH, fullWoods, c => { player(c); body(pen(c, MX, MY, GS), { pose: 'up', variant: DEF }); }, () => 0.85) : which === 'beam' ? fullBeam() : which === 'old' ? fullNightOld() : fullNight(); const c = document.createElement('canvas'); c.width = FW * FS; c.height = FH * FS; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0, c.width, c.height); return fetch('http://127.0.0.1:8799', { method: 'POST', body: name + '|' + c.toDataURL('image/png') }); };

async function compose() {
  await document.fonts.load('32px VT323');
  const rows = Math.ceil(panels.length / COLS), W = (COLS * PW + (COLS + 1) * GAP) * SC, H = (rows * (PH + LAB) + (rows + 1) * GAP + 22) * SC;
  const cv = document.getElementById('out'); cv.width = W; cv.height = H; const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = '#050506'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#f2e2b0'; x.font = `${16 * SC}px VT323`; x.fillText(`Hollow Pines  creature concepts v6  (antlers ${DEF})`, GAP * SC, 17 * SC);
  panels.forEach((pn, i) => {
    const c = i % COLS, r = Math.floor(i / COLS), px = (GAP + c * (PW + GAP)) * SC, py = (22 + GAP + r * (PH + LAB + GAP)) * SC;
    x.drawImage(pn.img, px, py, PW * SC, PH * SC);
    x.fillStyle = '#9a958a'; x.font = `${12 * SC}px VT323`; x.fillText(pn.name, px, py + (PH + 12) * SC);
  });
  window.SHEET_DONE = true;
}
compose();
window.postSheet = async name => fetch('http://127.0.0.1:8799', { method: 'POST', body: name + '|' + document.getElementById('out').toDataURL('image/png') });
</script>
